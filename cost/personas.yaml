# Mô phỏng chi phí khi dùng thật — Issue #13 & #38 (Khổng Tiến Dương).
# Mọi số hành vi đo từ data/preclass/chat.csv (05/11–25/11/2026, 21 ngày) bằng evidence/count_personas.py.
# Định nghĩa phiên: cột session_id trống ở 1.090/1.091 dòng nên ngắt phiên khi khoảng nghỉ giữa 2 câu liên tiếp của cùng học viên > 30 phút.
# Quy đổi 21 ngày ra tháng 30 ngày: uses_per_month = (số phiên / học viên trong 21 ngày) * (30 / 21).
# Chạy: python run.py simulate --try
#       python run.py simulate --rate-from eval/run-2.csv

sessions: 50        # số phiên mô phỏng (>= 50 theo yêu cầu CP4)
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # quy mô người dùng thật ở khoá AI20K Level 3–4 K5 (data/preclass/README.md & chat.csv)
  low: 143
  base: 436
  high: 721
  source: "data/preclass/README.md và chat.csv (05/11–25/11/2026): low = 143 học viên đã hỏi trợ giảng (evidence/count_tutor.py); base = 436 học viên có hoạt động trên pre-class; high = 721 tổng tài khoản trong learners.csv"

personas:           # 3 nhóm tách theo tổng số câu hỏi trong 21 ngày (1–2 / 3–10 / >=11 câu); tổng share = 1.00
  - name: dung_it
    share: 0.38
    uses_per_month: 1.5
    turns_per_session: 1
    source: "evidence/count_personas.py trên data/preclass/chat.csv (05/11–25/11/2026): nhóm 1–2 câu = 54/143 học viên (37.8%), 57 phiên (ngắt phiên >30 phút), 1.06 phiên/21 ngày * 30/21 = 1.51 phiên/tháng, TB 1.23 lượt/phiên (median 1)"
  - name: dung_vua
    share: 0.43
    uses_per_month: 2.8
    turns_per_session: 3
    source: "evidence/count_personas.py trên data/preclass/chat.csv (05/11–25/11/2026): nhóm 3–10 câu = 61/143 học viên (42.7%), 118 phiên (ngắt phiên >30 phút), 1.93 phiên/21 ngày * 30/21 = 2.76 phiên/tháng, TB 3.06 lượt/phiên (median 2)"
  - name: dung_nhieu
    share: 0.19
    uses_per_month: 7.0
    turns_per_session: 5
    source: "evidence/count_personas.py trên data/preclass/chat.csv (05/11–25/11/2026): nhóm >=11 câu = 28/143 học viên (19.6%), 137 phiên (ngắt phiên >30 phút), 4.89 phiên/21 ngày * 30/21 = 6.99 phiên/tháng, TB 4.82 lượt/phiên (median 3)"

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md (BTC kiểm 25/11/2026), cùng hãng Gemini với model đo eval
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "further-reading/model-prices.md (Google Gemini API https://ai.google.dev/gemini-api/docs/pricing, kiểm 25/11/2026) — tầng Nhỏ, đúng model đo eval"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "further-reading/model-prices.md (Google Gemini API https://ai.google.dev/gemini-api/docs/pricing, kiểm 25/11/2026) — tầng Lớn, cùng hãng Gemini"

